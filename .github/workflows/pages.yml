name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the static website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    # A manual run from another branch builds and tests but never publishes it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # A deploy can "succeed" while Pages still publishes the branch, which
      # renders README.md instead of the built site. Ask the live URL what it
      # is actually serving, and say what to change when it is the wrong thing.
      - name: Check what the live site serves
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            body="$(curl --connect-timeout 10 --max-time 20 -fsSL "$PAGE_URL" || true)"
            case "$body" in
              *"<title>Chorus"*) echo "The live site is serving Chorus."; exit 0 ;;
            esac
            echo "Attempt $attempt: $PAGE_URL is not serving Chorus yet."
            sleep 10
          done
          echo "::error title=Pages is publishing the branch, not the built site::Open Settings -> Pages -> Build and deployment -> Source and pick 'GitHub Actions'. While the source is 'Deploy from a branch', GitHub publishes the repository root, which renders README.md instead of the built website."
          exit 1
